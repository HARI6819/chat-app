<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <div>
      <div class="online" id="onlinemembers"></div>
      <div id="chatbox">
     </div>
      
      <br>
      <form id="chat-form">
        <input type="text" id="input" class="inp" placeholder="Type here..." autocomplete="off">
        <button id="btn">Send</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
